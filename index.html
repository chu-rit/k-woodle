<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한글 Woodle 도우미</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f6f8; color: #17212b; }
    .top-ad { display: flex; justify-content: center; width: min(100% - 32px, 560px); min-height: 50px; margin: 0 auto; padding-top: 8px; overflow: hidden; }
    .adblock-warning { display: none; position: fixed; inset: 0; z-index: 1000; place-items: center; padding: 24px; background: rgb(23 33 43 / 88%); }
    .adblock-warning.visible { display: grid; }
    .adblock-card { width: min(100%, 360px); padding: 28px 22px; border-radius: 16px; background: #fff; color: #17212b; text-align: center; box-shadow: 0 16px 40px rgb(0 0 0 / 25%); }
    .adblock-card h2 { margin: 0 0 12px; font-size: 1.2rem; }
    .adblock-card p { margin: 0; line-height: 1.6; color: #62707c; }
    .adblock-card button { margin-top: 20px; background: #2f80ed; color: #fff; }
    main { width: min(100% - 32px, 560px); margin: 0 auto; padding: 28px 0 40px; }
    .title-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    h1 { margin: 0; font-size: 1.55rem; }
    .game-toggle { display: flex; align-items: center; gap: 6px; color: #34424e; font-size: .9rem; white-space: nowrap; cursor: pointer; }
    .game-toggle input { width: 17px; height: 17px; accent-color: #2f80ed; }
    .panel { padding: 20px; background: #fff; border: 1px solid #e1e6eb; border-radius: 16px; box-shadow: 0 8px 24px rgb(23 33 43 / 6%); }
    .length-picker { display: flex; gap: 8px; margin-bottom: 16px; }
    .length-option { flex: 1; padding: 9px 8px; border: 1px solid #d6dde3; background: #f7f9fb; }
    .length-option.active { border-color: #2f80ed; background: #e8f1ff; color: #1769c2; font-weight: 700; }
    .mode-panel[hidden], .results-title[hidden] { display: none; }
    .history { display: grid; gap: 8px; margin-bottom: 12px; }
    .history-row, .inputs { display: grid; grid-template-columns: repeat(var(--length), minmax(0, 1fr)); gap: 8px; align-items: center; }
    .history-cell { display: grid; place-items: center; width: 100%; min-width: 0; aspect-ratio: 1; padding: 0; border: 2px solid #35a66f; border-radius: 12px; background: #dff5e9; color: #17212b; font-size: 1.55rem; font-weight: 700; line-height: 1; cursor: pointer; transition: background .15s, border-color .15s; }
    .game-panel .history-cell { cursor: default; }
    .history-cell.yellow, .jamo-input.yellow { border-color: #d6a900; background: #fff2b8; }
    .history-cell.gray, .jamo-input.gray { border-color: #8b949e; background: #dfe3e6; color: #5b6570; }
    .jamo-input { width: 100%; min-width: 0; aspect-ratio: 1; padding: 0; border: 2px solid #d6dde3; border-radius: 12px; background: #fbfcfd; color: #17212b; font-size: 1.55rem; font-weight: 700; line-height: 1; text-align: center; outline: none; transition: background .15s, border-color .15s; }
    .jamo-input.green { border-color: #35a66f; background: #dff5e9; }
    .jamo-input:focus { box-shadow: 0 0 0 3px rgb(47 128 237 / 16%); }
    .jamo-input.selected { outline: 3px solid rgb(47 128 237 / 28%); outline-offset: 2px; }
    .exclude-option { display: flex; align-items: center; gap: 8px; margin-top: 16px; color: #34424e; font-size: .92rem; cursor: pointer; }
    .exclude-option input { width: 17px; height: 17px; accent-color: #2f80ed; }
    .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; }
    button { border: 0; border-radius: 9px; padding: 10px 14px; background: #e9eef3; color: #34424e; font: inherit; cursor: pointer; }
    button:hover { background: #dfe7ee; }
    #status, .game-status { color: #62707c; font-size: .88rem; }
    .results-title { margin: 28px 0 10px; font-size: 1rem; }
    #results { display: grid; gap: 8px; }
    .result { width: 100%; padding: 13px 16px; border: 1px solid #e1e6eb; border-radius: 10px; background: #fff; color: #17212b; font-size: 1.1rem; letter-spacing: .08em; text-align: left; }
    .result:hover { background: #f0f6ff; border-color: #2f80ed; }
    .empty { padding: 22px 12px; color: #7b8791; text-align: center; background: #fff; border: 1px dashed #d6dde3; border-radius: 10px; }
    @media (max-width: 380px) { main { width: min(100% - 24px, 560px); padding-top: 20px; } .panel { padding: 16px; } .jamo-input, .history-cell { font-size: 1.3rem; } }
  </style>
</head>
<body>
  <div id="adblock-warning" class="adblock-warning" role="dialog" aria-modal="true" aria-labelledby="adblock-title">
    <div class="adblock-card"><h2 id="adblock-title">광고 차단기가 감지되었습니다</h2><p>광고 차단기를 해제해야 이 프로그램을 사용할 수 있습니다.</p><button id="adblock-retry" type="button">다시 확인</button></div>
  </div>
  <div class="top-ad" aria-label="광고"><ins class="kakao_ad_area" style="display:none;width:100%;" data-ad-unit="DAN-kILk8DoW0wkoyavP" data-ad-width="320" data-ad-height="50"></ins><script type="text/javascript" src="https://t1.kakaocdn.net/kas/static/ba.min.js" async></script></div>
  <main>
    <div class="title-row"><h1>한글 Woodle 도우미</h1><label class="game-toggle"><input id="game-mode" type="checkbox"> 게임하기</label></div>
    <section class="panel">
      <div class="length-picker" role="group" aria-label="자모 수 선택"><button class="length-option active" type="button" data-length="5">5자모</button><button class="length-option" type="button" data-length="6">6자모</button><button class="length-option" type="button" data-length="7">7자모</button></div>
      <div id="helper-panel" class="mode-panel">
        <div id="helper-history" class="history" aria-label="도우미 입력 내역"></div><div id="helper-inputs" class="inputs" style="--length:5"></div>
        <label class="exclude-option"><input id="exclude-parts" type="checkbox" checked> 형용사·감탄사·부사·동사 제외</label>
        <div class="actions"><span id="helper-status">단어 목록을 불러오는 중...</span><div><button id="helper-submit" type="button">입력</button><button id="helper-clear" type="button">초기화</button></div></div>
      </div>
      <div id="game-panel" class="mode-panel game-panel" hidden>
        <div id="game-history" class="history" aria-label="게임 내역"></div><div id="game-inputs" class="inputs" style="--length:5"></div>
        <div class="actions"><span id="game-status" class="game-status">게임을 준비하는 중...</span><div><button id="game-submit" type="button">입력</button><button id="game-clear" type="button">새 게임</button></div></div>
      </div>
    </section>
    <h2 id="results-title" class="results-title">추천 단어</h2><div id="results" aria-live="polite"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
